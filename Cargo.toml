[package]
name = "clipnest"
version = "1.9.10"
edition = "2021"
rust-version = "1.85"
description = "ClipNest · 剪贴匣 —— Windows 深色/浅色磨砂玻璃剪贴板管理器"
license = "MIT"
repository = "https://github.com/rosefinchlj/clipnest"
autobins = false
default-run = "clipnest"

[[bin]]
name = "clipnest"
path = "src/main.rs"

[[bin]]
name = "patch-icon"
path = "src/bin/patch_icon.rs"

[dependencies]
eframe = "=0.32.3"
chrono = "0.4.45"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tray-icon = "0.26.1"
window-vibrancy = "0.8.1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_System_Registry",
    "Win32_System_ProcessStatus",
    "Win32_System_Console",
    "Win32_System_SystemInformation",
    "Win32_System_Diagnostics_Debug",
    "Win32_Security",
] }
raw-window-handle = "0.6.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

